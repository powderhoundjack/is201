<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ski Escape: Avalanche Run</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        #score-board {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h1 { margin: 0; color: #2c3e50; }
        p { margin: 0; color: #555; }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:hover { transform: scale(1.05); background: #ff5252; }
        button:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        
        /* Boost effect text */
        .pop-text {
            position: absolute;
            color: #ffeb3b;
            font-weight: 900;
            font-size: 20px;
            text-shadow: 2px 2px 0px #000;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="score-board">
            <div>Distance: <span id="dist-display">0</span>m</div>
            <div style="font-size: 0.8em; color: #ffeaa7;">Speed: <span id="speed-display">0</span> kph</div>
        </div>
    </div>

    <div id="start-screen">
        <h1>Ski Escape</h1>
        <p>Outrun the avalanche!</p>
        <p><strong>Hold Click/Space</strong> to Backflip in air.</p>
        <p>Land flat for a <strong>BOOST</strong>!</p>
        <button id="start-btn">Start Skiing</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>Buried!</h1>
        <p>The avalanche caught you.</p>
        <p>Final Score: <span id="final-score">0</span>m</p>
        <button id="restart-btn">Try Again</button>
    </div>

    <script>
        /**
         * SKI SAFARI CLONE
         * A physics-based endless runner with jumps and hazards.
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // --- Game State ---
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let frameCount = 0;
        let score = 0;
        let highSpeedMode = false;

        // --- Inputs ---
        const keys = { space: false };
        let mousePressed = false;

        // --- Configuration ---
        const GRAVITY = 0.35; 
        const FRICTION_GROUND = 0.995; 
        const FRICTION_AIR = 0.999; 
        const ROTATION_SPEED = 0.05; 
        const JUMP_FORCE = 6.0; 
        const BOOST_SPEED = 6;
        const MAX_SPEED = 14; 
        const START_SPEED = 5.0; // Defined constant for consistent launch speed
        const CAMERA_OFFSET_X = 200; 
        const MIN_PLAYER_VX = 2.5; 

        // Hazard configuration
        const TREE_RADIUS = 20;

        // Jump Ramp configuration
        const JUMP_START_X = 2000;
        const JUMP_INTERVAL = 6000;
        const JUMP_LENGTH = 500;
        const JUMP_PEAK = -100; 

        // --- Objects ---
        
        const player = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            angle: 0, 
            radius: 15,
            onGround: false,
            crashed: false,
            crashTimer: 0,
            totalRot: 0, 
            
            reset() {
                this.x = 0;
                this.y = 0;
                this.vx = START_SPEED; // Always use the defined constant
                this.vy = 0;
                this.angle = 0;
                this.onGround = true;
                this.crashed = false;
                this.crashTimer = 0;
                this.totalRot = 0;
            }
        };

        const avalanche = {
            x: -500,
            speed: MIN_PLAYER_VX - 0.5, 
            reset() {
                this.x = -600;
                this.speed = MIN_PLAYER_VX - 0.5;
            }
        };

        let particles = [];
        let hazards = [];
        let nextHazardX = 4000; 

        // --- Collision Helper ---

        /**
         * Checks if the player at a given position is currently colliding with any hazard.
         * @param {number} px Player X position
         * @param {number} py Player Y position
         * @returns {boolean} True if a collision is detected.
         */
        function isCollidingWithHazard(px, py) {
            let colliding = false;
            
            hazards.forEach(h => {
                if (h.type === 'tree') {
                    // Tree is represented by a circle (stump/base collision)
                    const dx = px - h.x;
                    const dy = py - h.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // Collision occurs if distance is less than the sum of radii
                    if (distance < player.radius + h.radius) {
                        colliding = true;
                    }
                }
            });
            return colliding;
        }

        // --- Terrain Generation ---
        
        // Helper function for the jump parabola
        function getRampHeight(x, startX, length, peak) {
            const relativeX = x - startX;
            // Parabolic ramp: starts at 0, peaks at middle, ends at 0
            return peak * (1 - Math.pow((2 * relativeX / length) - 1, 2));
        }

        function getTerrainHeight(x) {
            // Bias: 0.55 ensures a strong net downhill movement.
            const downhillBias = x * 0.55;

            // Bumps
            const h1 = Math.sin(x * 0.005) * 40; 
            const h2 = Math.sin(x * 0.015) * 15; 
            const h3 = Math.sin(x * 0.05) * 4;   
            
            let jumpRamp = 0;

            // Inject Jump Ramps
            const segment = Math.floor((x - JUMP_START_X) / JUMP_INTERVAL);
            const startX = JUMP_START_X + segment * JUMP_INTERVAL;
            const endX = startX + JUMP_LENGTH;
            
            if (x >= startX && x < endX) {
                jumpRamp = getRampHeight(x, startX, JUMP_LENGTH, JUMP_PEAK);
            }
            
            return 400 + downhillBias + h1 + h2 + h3 + jumpRamp;
        }

        function getTerrainAngle(x) {
            const delta = 5;
            const y1 = getTerrainHeight(x - delta);
            const y2 = getTerrainHeight(x + delta);
            return Math.atan2(y2 - y1, delta * 2);
        }

        // --- Setup & Resize ---
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Input & Particles ---
        window.addEventListener('keydown', e => { if(e.code === 'Space') keys.space = true; });
        window.addEventListener('keyup', e => { if(e.code === 'Space') keys.space = false; });
        window.addEventListener('mousedown', () => mousePressed = true);
        window.addEventListener('mouseup', () => mousePressed = false);
        window.addEventListener('touchstart', (e) => { mousePressed = true; e.preventDefault(); }, {passive: false});
        window.addEventListener('touchend', (e) => { mousePressed = false; e.preventDefault(); });

        function createParticles(x, y, count, type) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5 + player.vx * 0.5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0,
                    type: type // 'snow', 'fire', 'crash'
                });
            }
        }

        function showFloatingText(text, x, y) {
            const el = document.createElement('div');
            el.className = 'pop-text';
            el.innerText = text;
            el.style.left = (window.innerWidth/2) + 'px';
            el.style.top = (window.innerHeight/2 - 50) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }
        
        // --- Hazard Generation ---

        function generateHazards() {
            const HAZARD_INTERVAL = 10000; // Increased spacing for smaller obstacles
            const buffer = 1000; // Don't generate too close to player

            if (player.x > nextHazardX - buffer) {
                const groundY = getTerrainHeight(nextHazardX);
                
                // Add Tree Hazard
                hazards.push({
                    type: 'tree',
                    x: nextHazardX,
                    y: groundY - TREE_RADIUS / 2, // Center Y on the ground line (base)
                    radius: TREE_RADIUS
                });
                
                nextHazardX += HAZARD_INTERVAL + Math.random() * 2000; // Randomize spacing
            }
        }


        // --- Main Game Loop ---
        function update() {
            if (gameState !== 'PLAYING') return;

            // 1. Avalanche Logic 
            
            // Set minimum avalanche speed
            avalanche.speed = Math.max(MIN_PLAYER_VX - 0.5, avalanche.speed); 

            if (player.vx > avalanche.speed + 2) {
                // Player is pulling away fast, let avalanche gain slightly slower
                avalanche.speed += 0.005; 
            } else if (player.vx < avalanche.speed) {
                // Player slowed down (crashed), avalanche accelerates aggressively
                avalanche.speed += 0.1; 
            } else {
                // Maintain a slight slow gain 
                avalanche.speed += 0.003; 
            }

            // Cap avalanche speed slightly below player max speed
            if (avalanche.speed > MAX_SPEED - 5) avalanche.speed = MAX_SPEED - 5; 

            avalanche.x += avalanche.speed;


            // 2. Player Physics
            const inputActive = keys.space || mousePressed;

            if (player.crashed) {
                // Slow player down moderately, but keep momentum
                player.vx *= 0.98; 
                player.crashTimer--;
                
                // --- CRASH RECOVERY LOGIC ---
                if(player.crashTimer <= 0) {
                    const stillColliding = isCollidingWithHazard(player.x, player.y);
                    
                    if (!stillColliding) {
                        // Safe to recover
                        player.crashed = false;
                        player.angle = 0; 
                    } else {
                        // Still inside the obstacle. Maintain crashed state and reset timer shorty
                        player.crashTimer = 10; 
                    }
                }
                // -----------------------------

            } else if (player.onGround) {
                // --- Ground Physics ---
                
                const slope = getTerrainAngle(player.x);
                player.vx += Math.sin(slope) * 0.2; 
                player.vx *= FRICTION_GROUND;
                player.angle = player.angle + (slope - player.angle) * 0.2;
                player.y = getTerrainHeight(player.x);

                // Flying off check
                if (player.vx > 8) {
                    const nextX = player.x + player.vx;
                    const nextYTerrain = getTerrainHeight(nextX);
                    const nextYProjected = player.y + Math.sin(player.angle) * player.vx + GRAVITY;
                    
                    if (nextYTerrain > nextYProjected + 5) {
                         player.onGround = false;
                         // Keep the horizontal speed component consistent
                         player.vy = Math.sin(player.angle) * player.vx;
                         player.totalRot = 0;
                    }
                }

                // Manual Jump
                if (inputActive && player.vx > 2) {
                    player.vy = -JUMP_FORCE;
                    player.onGround = false;
                    player.totalRot = 0;
                }

                // Anti-Stuck Nudge 
                if (player.vx < MIN_PLAYER_VX) player.vx += 0.05;

            } else {
                // --- Air Physics ---
                player.vy += GRAVITY;
                player.vx *= FRICTION_AIR; // High friction keeps horizontal speed steady
                
                player.x += player.vx; // Update X based on dampened VX
                player.y += player.vy;

                // Rotation (Backflip)
                if (inputActive) {
                    player.angle -= ROTATION_SPEED;
                    player.totalRot += ROTATION_SPEED;
                }

                // Landing Check
                const groundH = getTerrainHeight(player.x);
                if (player.y >= groundH) {
                    const slope = getTerrainAngle(player.x);
                    
                    // Normalize angles
                    let diff = player.angle - slope;
                    while (diff > Math.PI) diff -= Math.PI*2;
                    while (diff < -Math.PI) diff += Math.PI*2;

                    // Landing logic
                    if (Math.abs(diff) > 1.0) { 
                        // CRASH
                        player.crashed = true;
                        player.crashTimer = 60;
                        player.vx *= 0.6; // Retain momentum
                        createParticles(player.x, player.y, 20, 'crash');
                    } else {
                        // SUCCESSFUL LANDING
                        player.onGround = true;
                        player.vy = 0;
                        player.y = groundH; 
                        
                        // Boost logic: ONLY on successful backflip (Total rotation check)
                        if (player.totalRot > Math.PI * 1.8) {
                            player.vx += BOOST_SPEED;
                            showFloatingText("PERFECT LANDING!", 0, 0);
                            createParticles(player.x, player.y, 30, 'fire');
                            highSpeedMode = true;
                            setTimeout(() => highSpeedMode = false, 2000);
                        }
                    }
                }
            }

            // Move X (Re-applied based on state for clarity)
            if (player.onGround || player.crashed) {
                // Use angled movement on ground, simple slide when crashed
                player.x += Math.cos(player.angle) * player.vx;
                player.y = getTerrainHeight(player.x); // Ensure Y is snapped to ground when on ground/crashed
            } 
            // NOTE: Air movement is handled inside the 'else' block above (player.x += player.vx)


            // 3. Hazard Logic & Collision
            generateHazards();
            hazards = hazards.filter(h => h.x > player.x - width); // Cleanup old hazards

            if (!player.crashed) { 
                // Only check for new collisions if player is NOT already crashed
                hazards.forEach(h => {
                    if (h.type === 'tree') {
                        if (isCollidingWithHazard(player.x, player.y)) {
                            // Hit the tree!
                            player.crashed = true;
                            player.crashTimer = 90; 
                            player.vx *= 0.6; // Retain momentum
                            createParticles(player.x, player.y, 50, 'crash');
                            showFloatingText("TREE COLLISION!", 0, 0);
                        }
                    }
                });
            }


            // Game Over
            if (avalanche.x > player.x - 20) { 
                gameState = 'GAMEOVER';
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = Math.floor(player.x / 10);
            }

            // Score & UI
            score = Math.floor(player.x / 10);
            document.getElementById('dist-display').innerText = score;
            document.getElementById('speed-display').innerText = Math.floor(player.vx * 3);

            // Cap Speed
            if (player.vx > MAX_SPEED) player.vx = MAX_SPEED;
            if (player.vx < 0) player.vx = 0; 
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, width, height);

            // Camera
            const camX = player.x - CAMERA_OFFSET_X;
            const camY = player.y - height/2 + 100;

            ctx.save();
            ctx.translate(-camX, -camY);

            // 1. Background
            const paraX = camX * 0.5;
            ctx.fillStyle = '#bde0ea'; 
            ctx.beginPath();
            ctx.moveTo(camX, height + camY); 
            for(let i = Math.floor(camX/100); i < Math.floor((camX+width)/100) + 2; i++) {
                const mx = i * 100;
                const my = (camY + height/2) - 200 - Math.abs(Math.sin(i * 1321) * 300);
                ctx.lineTo(mx, my);
            }
            ctx.lineTo(camX + width, height + camY);
            ctx.fill();

            // 2. Terrain
            ctx.fillStyle = '#ecf0f1';
            ctx.beginPath();
            const startX = Math.floor(camX / 10) * 10;
            const endX = startX + width + 100;
            
            ctx.moveTo(startX, height + camY + 800); 
            ctx.lineTo(startX, getTerrainHeight(startX));

            for (let x = startX; x <= endX; x += 20) {
                ctx.lineTo(x, getTerrainHeight(x));
            }
            
            ctx.lineTo(endX, height + camY + 800); 
            ctx.fill();

            // Terrain Outline
            ctx.strokeStyle = '#bdc3c7';
            ctx.lineWidth = 4;
            ctx.stroke();

            // 3. Hazards (Tree)
            hazards.forEach(h => {
                if (h.type === 'tree') {
                    ctx.save();
                    ctx.translate(h.x, h.y);
                    
                    // Trunk (Brown)
                    ctx.fillStyle = '#8b4513';
                    const trunkW = h.radius * 0.7;
                    const trunkH = 50;
                    ctx.fillRect(-trunkW/2, h.radius/2 - trunkH, trunkW, trunkH);
                    
                    // Green Top (Coniferous style)
                    ctx.fillStyle = '#27ae60';
                    ctx.beginPath();
                    ctx.moveTo(0, h.radius/2 - trunkH - 30);
                    ctx.lineTo(trunkW * 2, h.radius/2 - trunkH/2);
                    ctx.lineTo(-trunkW * 2, h.radius/2 - trunkH/2);
                    ctx.closePath();
                    ctx.fill();

                    // Collision Stump/Base (Darker brown circle where collision happens)
                    ctx.fillStyle = '#6d4c41'; 
                    ctx.beginPath();
                    ctx.arc(0, h.radius/2, h.radius, 0, Math.PI*2);
                    ctx.fill();

                    ctx.restore();
                }
            });


            // 4. Player
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            // Skis
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(-20, 10, 40, 5);

            // Body
            if (player.crashed) ctx.fillStyle = '#7f8c8d'; 
            else ctx.fillStyle = '#2c3e50'; 
            ctx.fillRect(-10, -20, 20, 30);

            // Head
            ctx.fillStyle = '#f1c40f'; 
            ctx.beginPath();
            ctx.arc(0, -25, 10, 0, Math.PI*2);
            ctx.fill();

            // Scarf
            if (!player.crashed) {
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(-5, -20);
                ctx.lineTo(-25 - (player.vx*2), -20 + Math.sin(frameCount * 0.5)*10);
                ctx.stroke();
            }

            // Boost Effect
            if (highSpeedMode) {
                ctx.fillStyle = 'rgba(50, 200, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(-15, 5, 15 + Math.random()*10, 0, Math.PI*2);
                ctx.fill();
            }

            ctx.restore();

            // 5. Avalanche
            ctx.fillStyle = '#ecf0f1';
            ctx.beginPath();
            ctx.moveTo(avalanche.x, getTerrainHeight(avalanche.x));
            for(let y = getTerrainHeight(avalanche.x); y > camY - 200; y -= 40) {
                ctx.lineTo(avalanche.x + (Math.random()*40 - 20), y);
            }
            ctx.lineTo(camX - 100, camY - 200);
            ctx.lineTo(camX - 100, height + camY);
            ctx.fill();
            
            ctx.fillStyle = 'rgba(255,255,255, 0.5)';
            for(let i=0; i<20; i++) {
                ctx.beginPath();
                const px = avalanche.x + Math.random() * 100;
                const py = camY + Math.random() * height;
                ctx.arc(px, py, Math.random() * 20 + 10, 0, Math.PI*2);
                ctx.fill();
            }

            // 6. Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; 
                p.life -= 0.02;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.globalAlpha = p.life;
                if (p.type === 'fire') ctx.fillStyle = '#f1c40f';
                else if (p.type === 'crash') ctx.fillStyle = '#7f8c8d';
                else ctx.fillStyle = 'white';
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            if (player.onGround && player.vx > 5) {
                createParticles(player.x - 10, player.y + 10, 1, 'snow');
            }

            ctx.restore();
            frameCount++;
            requestAnimationFrame(gameState === 'PLAYING' ? gameLoop : draw);
        }

        function gameLoop() {
            update();
            draw();
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            gameState = 'PLAYING';
            player.reset();
            avalanche.reset();
            hazards = [];
            nextHazardX = 4000;
            document.getElementById('start-screen').classList.add('hidden');
            gameLoop();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            gameState = 'PLAYING';
            player.reset();
            avalanche.reset();
            particles = [];
            hazards = [];
            nextHazardX = 4000;
            document.getElementById('game-over-screen').classList.add('hidden');
            gameLoop();
        });

        draw();

    </script>
</body>
</html>
